name: Build & Release Auria Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Collect version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$CODE" >> "$GITHUB_OUTPUT"

      - name: Build module
        run: bash build_auria.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Auria Tweak ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Auria Tweak ${{ steps.version.outputs.VERSION }}

            - Thermal policy (MediaTek & Snapdragon)
            - Battery & fast-charge
            - Display + refresh/animasi
            - Render (GPU + CPU)
            - IO scheduler & read-ahead
            - VM balancing

            Flash via Magisk / KernelSU / APatch, lalu reboot.
          files: auria_tweak-*.zip
          draft: false
          prerelease: false